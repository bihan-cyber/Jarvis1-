<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI Assistant</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-top: 0;
        }
        #chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            background: #0f172a;
            margin-bottom: 15px;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .user {
            background: #0284c7;
            text-align: right;
            margin-left: 20%;
        }
        .assistant {
            background: #334155;
            text-align: left;
            margin-right: 20%;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #0ea5e9;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>JARVIS AI</h1>
    <div id="chat-box"></div>
    <div class="input-group">
        <input type="text" id="user-input" placeholder="Type a message or command..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const GROQ_API_KEY = "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";

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const userText = inputField.value.trim();

        if (!userText) return;

        // Render User Message
        appendMessage(userText, "user");
        inputField.value = "";

        // Check for API Key
        if (GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE" || !GROQ_API_KEY) {
            appendMessage("Error: Please replace 'YOUR_GROQ_API_KEY_HERE' in the code with your actual Groq API key.", "assistant");
            return;
        }

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "You are Jarvis, an advanced AI assistant. Keep responses helpful, direct, and conversational." },
                        { role: "user", content: userText }
                    ]
                })
            });

            const data = await response.json();
            
            if (data.choices && data.choices[0]) {
                const aiReply = data.choices[0].message.content;
                appendMessage(aiReply, "assistant");
                speakText(aiReply);
            } else {
                appendMessage("Error: Invalid response from Groq API.", "assistant");
            }
        } catch (error) {
            console.error("Error calling Groq API:", error);
            appendMessage("Error: Failed to connect to Groq API. Check console for details.", "assistant");
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById("chat-box");
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("message", sender);
        messageDiv.textContent = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            utterance.pitch = 1;
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
